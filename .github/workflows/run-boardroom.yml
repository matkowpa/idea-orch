name: run-boardroom

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug sesji — pomysł zostanie odczytany z queue/<slug>.md"
        required: true

jobs:
  boardroom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run boardroom (live progress commits)
        env:
          SLUG: ${{ inputs.slug }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python orchestrator.py --idea "queue/$SLUG.md" --name "$SLUG" &
          PID=$!
          while kill -0 $PID 2>/dev/null; do
            sleep 20
            if [ -f "sessions/$SLUG/_progress.json" ]; then
              git add -f "sessions/$SLUG/_progress.json" 2>/dev/null || true
              git commit -m "progress: $SLUG" || true
              git pull --rebase origin main || true
              git push || true
            fi
          done
          wait $PID

      - name: Commit results
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          git pull --rebase origin main || true
          git config user.name "boardroom-bot"
          git config user.email "actions@github.com"
          git add -f "sessions/$SLUG" || true
          git commit -m "Boardroom: wynik debaty dla '$SLUG'" || echo "nothing to commit"
          git push
