<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>idea-orch — Boardroom</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<main>
  <h1>🪑 idea-orch — Boardroom</h1>
  <p class="muted">Rada agentów oceni Twój pomysł biznesowy. Wynik: koncepcja + werdykt GO / NO-GO / PIVOT.</p>

  <section id="form-section">
    <label>Slug sesji (kebab-case, opcjonalnie — wygenerujemy z pomysłu)</label>
    <input id="slug" placeholder="np. aplikacja-do-rachunkow">

    <label>Pomysł (tekst lub wklej treść idea.md)</label>
    <textarea id="idea" rows="10" placeholder="Opisz pomysł na aplikację..."></textarea>

    <label>Lub wczytaj plik .md</label>
    <input type="file" id="file" accept=".md,.txt">

    <label>GitHub PAT (fine-grained: Contents RW + Actions W na to repo; trzymany w sessionStorage)</label>
    <input type="password" id="pat" placeholder="github_pat_...">

    <button id="run">Uruchom debatę</button>
    <div id="progress-wrap" hidden>
      <div id="progress-bar"></div>
    </div>
    <div id="progress-label" class="muted" hidden></div>
    <div id="status" class="muted"></div>
  </section>

  <section id="result-section" hidden>
    <h2>Werdykt</h2>
    <article id="result"></article>
    <p id="artifacts-link" class="muted"></p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
