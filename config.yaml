session:
  rounds: 2                    # maksymalna liczba rund debaty
  max_discussion_chars: 6000   # limit kontekstu opinii wstrzykiwanych agentom
  temperature: 0.7
  max_tokens: 2000

models:
  glm:    "openrouter/z-ai/glm-5.3"                 # tańszy model — rola Sceptyka
  strong: "openrouter/anthropic/claude-sonnet-5"  # Moderator / Sędzia / Architekt
  vision: "openrouter/openai/gpt-5.1"                # Visioner
  mid:    "openrouter/openai/gpt-5-mini"           # Analityk
  # szybki profil frontendu (wszystkie role jednym modelem):
  # flash: "openrouter/z-ai/glm-5.3-flash"

agents:
  architect:
    model: strong
    role_file: roles/architect.md
  sceptic:
    model: glm
    role_file: roles/sceptic.md
  visionary:
    model: vision
    role_file: roles/visionary.md
  analyst:
    model: mid
    role_file: roles/analyst.md
  moderator:
    model: strong
    role_file: roles/moderator.md
  judge:
    model: strong
    role_file: roles/judge.md

# agenci biorący udział w rundach opinii (kolejność = kolejność wstrzykiwania)
discussing_agents: [sceptic, visionary, analyst]
